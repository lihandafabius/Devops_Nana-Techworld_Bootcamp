---
- name: Provision networking infrastructure
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: "eu-north-1"
    availability_zone: "eu-north-1a"

    vpc_cidr: "10.0.0.0/16"
    public_subnet_cidr: "10.0.1.0/24"
    private_subnet_cidr: "10.0.2.0/24"

    vpc_name: "Java-gradle-app-vpc"
    public_subnet_name: "Java-gradle-app-public-subnet"
    private_subnet_name: "Java-gradle-app-private-subnet"
    igw_name: "Java-gradle-app-igw"
    public_route_table_name: "Java-gradle-app-public-rt"
    private_route_table_name: "Java-gradle-app-private-rt"
    nat_gateway_name: "Java-gradle-app-nat"
    ansible_python_interpreter: "/home/fabius-lihanda/Devops/Devops_Nana-Techworld_Bootcamp/ansible-exercises/venv/bin/python"

  tasks:

    # VPC

    - name: Create VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ vpc_name }}"
        cidr_block: "{{ vpc_cidr }}"
        region: "{{ aws_region }}"
        state: present
        tags:
          Name: "{{ vpc_name }}"
      register: vpc

    # PUBLIC SUBNET

    - name: Create public subnet
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ public_subnet_cidr }}"
        az: "{{ availability_zone }}"
        region: "{{ aws_region }}"
        map_public: true
        state: present
        tags:
          Name: "{{ public_subnet_name }}"
      register: public_subnet

    # PRIVATE SUBNET

    - name: Create private subnet
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ private_subnet_cidr }}"
        az: "{{ availability_zone }}"
        region: "{{ aws_region }}"
        map_public: false
        state: present
        tags:
          Name: "{{ private_subnet_name }}"
      register: private_subnet

    # INTERNET GATEWAY

    - name: Create Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        state: present
        tags:
          Name: "{{ igw_name }}"
      register: igw

    # PUBLIC ROUTE TABLE

    - name: Create public route table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        tags:
          Name: "{{ public_route_table_name }}"
        subnets:
          - "{{ public_subnet.subnet.id }}"
        routes:
          - dest: "0.0.0.0/0"
            gateway_id: "{{ igw.gateway_id }}"
        state: present

    # ELASTIC IP FOR NAT GATEWAY

    - name: Allocate Elastic IP for NAT Gateway
      amazon.aws.ec2_eip:
        region: "{{ aws_region }}"
        in_vpc: true
        state: present
      register: nat_eip

    # NAT GATEWAY

    - name: Create NAT Gateway
      amazon.aws.ec2_vpc_nat_gateway:
        subnet_id: "{{ public_subnet.subnet.id }}"
        allocation_id: "{{ nat_eip.allocation_id }}"
        region: "{{ aws_region }}"
        state: present
        wait: true
        tags:
          Name: "{{ nat_gateway_name }}"
      register: nat_gateway

    # PRIVATE ROUTE TABLE

    - name: Create private route table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        tags:
          Name: "{{ private_route_table_name }}"
        subnets:
          - "{{ private_subnet.subnet.id }}"
        routes:
          - dest: "0.0.0.0/0"
            nat_gateway_id: "{{ nat_gateway.nat_gateway_id }}"
        state: present

    - name: Display networking information
      debug:
        msg:
          - "VPC ID: {{ vpc.vpc.id }}"
          - "Public subnet ID: {{ public_subnet.subnet.id }}"
          - "Private subnet ID: {{ private_subnet.subnet.id }}"



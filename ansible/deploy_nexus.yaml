---
- name: Install java and net-tools
  hosts: nexus_server
  become: true # execute tasks with elevated privileges
  tasks:
    - name: Update apt repo and cache
      apt:
        update_cache: yes
        force_apt_get: yes
        cache_valid_time: 3600
    - name: Install java and net-tools
      apt:
        name:
          - openjdk-17-jre-headless
          - net-tools

- name: Download and unpack nexus installer
  hosts: nexus_server
  become: true # execute tasks with elevated privileges
  tasks:
    - name: Check if nexus folder already exists
      stat:
        path: /opt/nexus
      register: nexus_folder

    - name: Download nexus
      get_url:
        url: https://download.sonatype.com/nexus/3/nexus-3.96.0-09-linux-x86_64.tar.gz
        dest: /opt/nexus.tar.gz

    - name: Untar nexus installer
      unarchive:
        src: /opt/nexus.tar.gz
        dest: /opt/
        remote_src: yes
      when: not nexus_folder.stat.exists

    - name: Find nexus directory
      find:
        paths: /opt
        patterns: "nexus-*"
        file_type: directory
      register: nexus_dir
    - debug: msg={{ nexus_dir }}
    
    - name: Rename nexus directory
      shell: mv {{ nexus_dir.files[0].path }} /opt/nexus
      when: not nexus_folder.stat.exists

- name: Create nexus user and group
  hosts: nexus_server
  become: true # execute tasks with elevated privileges
  tasks:
    - name: Create nexus group
      group:
        name: nexus
        state: present # ensure the group is present
    - name: Create nexus user
      user:
        name: nexus
        group: nexus
        state: present
    - name: Change ownership of nexus directory
      file:
        path: /opt/nexus
        state: directory
        owner: nexus
        group: nexus
        recurse: yes

    - name: Change ownership of sonatype directory
      file:
        path: /opt/sonatype-work
        state: directory
        owner: nexus
        group: nexus
        recurse: yes

- name: Start nexus with nexus user
  hosts: nexus_server
  become: true # execute tasks with elevated privileges
  tasks:
    - name: Set run_as_user in nexus.rc
      lineinfile:
        path: /opt/nexus/bin/nexus.rc
        # regexp: '^run_as_user='
        line: 'run_as_user=nexus'
        create: yes

    - name: Start nexus service
      command: /opt/nexus/bin/nexus start

- name: Verify nexus service is running
  hosts: nexus_server
  become: true # execute tasks with elevated privileges
  tasks:
    - name: Check with ps command
      shell: ps aux | grep nexus
      register: nexus_status
    - debug: msg={{ nexus_status.stdout_lines }}

    - name: wait for nexus to start
      pause:
        minutes: 1


    - name: Check with netstat command
      shell: netstat -plnt
      register: nexus_status_netstat
    - debug: msg={{ nexus_status_netstat.stdout_lines }}


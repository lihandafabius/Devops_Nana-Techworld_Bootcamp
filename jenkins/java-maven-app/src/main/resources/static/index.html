<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyApp</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 60px 20px;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            min-height: 80vh;
        }

        .hero-text {
            flex: 1;
        }

        .hero-text h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero-text h1 span {
            color: #38bdf8;
        }

        .hero-text p {
            font-size: 18px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 24px;
            background: #0ea5e9;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn:hover {
            background: #0284c7;
        }

        .hero-image {
            flex: 1;
        }

        .hero-image img {
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .tag {
            display: inline-block;
            background: #1e293b;
            color: #38bdf8;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .hero {
                flex-direction: column;
                text-align: center;
                padding-top: 30px;
            }

            .hero-text h1 {
                font-size: 36px;
            }

            .hero-image img {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="hero">

            <div class="hero-text">
                <div class="tag">Java • Maven • Spring Boot</div>

                <h1>Welcome to <span>MyApp</span></h1>

                <p>

            </div>

</html>
